<noscript><p style="color:#ffd99a;font:16px Georgia;text-align:center;margin-top:40vh">Lanternfall needs JavaScript to run.</p></noscript>
<script>
/* =====================================================================
   LANTERNFALL v1.0.0 (Polish 5, ship candidate)
   Single-file HTML5 canvas game. No external assets. Vanilla JS.

   ARCHITECTURE
   - CONFIG / BIOMES / FLOOR_MIX / ENEMY_TYPES ... data tables
   - Settings ...... volumes, shake, reduced flashing, touch UI scale,
                     controls (localStorage 'lanternfall.settings')
   - Input / TouchPad  keyboard + mouse; floating twin sticks, dash, test drawer
   - Sfx / Music ... WebAudio: sfx/music/ambient buses -> compressor ->
                     limiter; 6 floor themes + title theme; SFX variation
   - Perf .......... frame-time governor (particle cap, light-mask res)
   - Camera / FX ... follow + trauma shake; particles, texts, banners, hit-stop
   - Dungeon ....... procedural floors; tags start / exit / boss arena /
                     treasure room (every floor) / shop room (floors 2-5)
   - Entities ...... Player (stat block "mods", dash charges, lantern type),
                     Bolt (pierce / ricochet / size), Pickup, RelicPickup,
                     FireTrail, Portal, Glob, 10 enemies (+elites), 4 bosses + hazards
   - RELICS ........ 21 relics (13 base, 4 cursed, 4 unlocked by meta);
                     each edits the player's mods block when claimed
   - Meta .......... localStorage 'lanternfall.meta': ash, unlocks, lantern
   - Shop .......... the Lamplighter: 3 offers, prices scale with depth
   - Game .......... states title / settings / howto / camp / play / paused /
                     bossmenu / dead / transition (floor card) / victory
   - Renderer ...... world -> entities -> light mask -> telegraphs and
                     labels (always above darkness) -> HUD / cards / menus

   =====================================================================
   FINAL-CANDIDATE SUMMARY (Polish Loop 4)
   GAME: 6 floors, each ending in a named fight - 1 Old Tallow (mini),
   2 Mother Moth, 3 Drowned Bell, 4 The Glass Choir (mini), 5 Gloamjaw,
   6 Hollow King; then endless remixed depths. Lantern / Ember / Ashen,
   Daily Descent, Last Hearth upgrades, 21 relics, Codex (37), 14
   achievements, Continue run (saved at every floor start).
   CONTROLS
   - Keyboard + mouse: WASD move (physical keys, so ZQSD on AZERTY too);
     mouse aim + click (or arrows) fire; Space/Shift/right-click dash;
     E interact/buy; P/Esc pause. Scheme B in Settings: WASD/arrows move,
     IJKL/mouse fire.
   - Touch: left floating stick move (full speed at 75% throw), right
     stick aim + fire; auto-fire at the nearest visible enemy when the
     right thumb is free (Settings > Auto-fire, on by default); quick tap
     on the right fires (aim assist snaps to the nearest visible enemy,
     Settings > Aim assist); dash button; pause/fullscreen buttons.
   - Gamepad (standard mapping): left stick move, right stick aim, RT/RB
     fire, A/LB/LT dash, X interact, Start pause; menus D-pad/stick + A / B.
   - Feel (Controls pass, Nov 12 2026): snappy target-velocity movement
     (Settings > Movement: Snappy / Glide = the Polish 4 physics), 0.15 s
     dash buffer (also through hit-stop), corner assist at wall edges,
     movement substeps, light recoil, pause + key release on blur or tab
     hidden, stale touches dropped, sticks cleared on rotation.
   - Settings: volumes, shake, reduced flashing, touch UI scale, scheme,
     movement, aim assist, auto-fire, fixed move stick, vibration,
     colorblind-safe telegraphs, larger text.
   TEST MODE (double-tap T, or a 0.6 s 3-finger hold -> drawer): V invulnerable, R refill
   light, N next floor, C clear room, B boss menu, X boss -20%, G relic,
   M +50 embers, 1-6 spawn crawler/wisp/mites/brute/spitter/mirror.
   URL hook ?nostory skips intro/ending (tests only).
   POLISH 4: crash catcher - any exception in the frame loop shows a
   "Something broke - press R / tap to restart the floor" card (run,
   relics and light kept) instead of freezing. Watchdog: NaN hero /
   enemy positions repaired, hero wedged in a wall nudged free, boss out
   of its arena returned after 1.5 s, an add stranded outside a sealed
   room brought in after 4 s, a sealed room with nobody left and no waves
   cleared after 3 s. Damaged run saves (bad JSON, wrong version, bad
   fields) are dropped; a fault while loading Continue returns to the
   title with a toast. Balance: Hollow King phase II on Lantern only -
   Bell-echo attacks 20% softer and ~0.35 s slower, and his phase-I
   mothlings dissolve into up to 4 light shards when phase II starts.
   NUMBERS (headless jsdom + @napi-rs/canvas CPU raster, dt 16 ms)
   - Fairness bot (Lantern unless noted, 0.25 s reaction, no invuln):
     King 32 tries: before 14/32, after 22/32 on the final build (22/32
     and 25/32 on earlier after-runs); King Ember 6/32 -> 7/32, Ashen
     0/32 (their code is unchanged). Bell 32 tries: 16/32, 19/32
     (unchanged). Final 16-try set: Old Tallow 16, Moth 13, Bell 6,
     Glass Choir 16, Gloamjaw 15, King 12.
   - Light cost vs Polish 2 (Polish 3 work): q2 -63%, q1 -46%, q0 -65%.
   - 360-floor spawn check: stairs, chests, keepers, boss spots on clear
     reachable floor, 0 bad; each named arena on its floor 50/50.
   TEST SETTINGS DISCLOSED: setup teleports then real DOM key / mouse /
   touch events; synthetic Gamepad objects; mocked navigator.vibrate;
   crash test injects a throwing update into the real rAF loop; t16 pixel
   minimums for walk frames / small props 60 -> 40 px.
   KNOWN ISSUES: endless depths have no mini-bosses; toasts wait (not
   drop) on the smallest phones while Codex is open; Bell is the hardest
   boss for the bot (~50%); bot win rates swing +-15% at 16-32 tries;
   the crash card restarts the floor but cannot fix a fault that recurs
   every frame (it re-shows); lighting is a soft overlay, no shadows.
   UNTESTED ON REAL DEVICES: phones (touch feel, safe areas, fullscreen),
   real gamepads and rumble, vibration motors, real GPU frame cost, real
   audio output, human playtest of the mini-bosses and the King change.
   ===================================================================== */
'use strict';
const VERSION = '1.0.0'; /* ship version: shown on the title screen footer and in the page title */

// ---------------------------------------------------------------- CONFIG
const CONFIG = {
  tile: 32,
  floors: 6,
  bossFloors: { 1: 'tallow', 2: 'moth', 3: 'bell', 4: 'choir', 5: 'gloam', 6: 'king' }, // Polish 3: mini-bosses on floors 1 and 4 - // each boss lives in its namesake biome
  player: {
    radius: 12, accel: 2600, maxSpeed: 265, friction: 10, moveK: 24, stopK: 20, knockK: 5, recoil: 10, dashBuffer: 0.15, /* Controls pass: snappy target-velocity response (1/s) */
    dashSpeed: 820, dashTime: 0.16, dashCooldown: 0.55, dashCost: 6, dashIFrames: 0.24, dashDist: 115,
    hurtIFrames: 0.8,
  },
  light: {
    max: 100, start: 100, minRadius: 70, maxRadius: 360, coreFrac: 0.42,
    regenDelay: 0.8, regenRate: 9, poolRate: 30, flicker: 0.025, floorBonus: 20,
  },
  bolt: { speed: 760, cost: 2.5, fireRate: 0.14, damage: 10, radius: 5, life: 0.9, knock: 240 },
  shake: { decay: 2.4, max: 22 },
};

const BIOMES = [
  { name: 'Ember Hollows', sub: 'Where the last fires still remember warmth', floor: '#2b1d18', floor2: '#31211b', wall: '#4d3024', top: '#71442c', edge: '#120a08', accent: '#ff8a3d', dark: '5,2,2', mm: '#a8734f', pool: '255,150,60', root: 55 },
  { name: 'Mothwood Grotto', sub: 'Pale wings beat among the roots', floor: '#1b221a', floor2: '#20291f', wall: '#2f3b2a', top: '#47573b', edge: '#090d08', accent: '#d8e8a0', dark: '2,4,2', mm: '#7d9a6a', pool: '220,240,160', root: 49 },
  { name: 'Sunken Bellworks', sub: 'Something tolls beneath the water', floor: '#15212b', floor2: '#192834', wall: '#25394b', top: '#375871', edge: '#060b10', accent: '#6fc8ff', dark: '1,3,6', mm: '#5b86a8', pool: '120,200,255', root: 41.2 },
  { name: 'Glass Veins', sub: 'The walls bleed light that is not yours', floor: '#1e1828', floor2: '#251e31', wall: '#3a2d52', top: '#5b4782', edge: '#0b0712', accent: '#c49bff', dark: '3,1,6', mm: '#8b72b8', pool: '200,160,255', root: 61.7 },
  { name: 'Gloam Maw', sub: 'The dark here has teeth', floor: '#1b1214', floor2: '#22171a', wall: '#3b1e25', top: '#5c2a33', edge: '#090405', accent: '#ff4a5a', dark: '5,1,2', mm: '#9c5560', pool: '255,110,110', root: 46.2 },
  { name: 'The Hollow Throne', sub: 'A crown waits for the last light', floor: '#19171d', floor2: '#1f1c25', wall: '#34313e', top: '#57526c', edge: '#070609', accent: '#ffe08a', dark: '2,2,3', mm: '#9a93ad', pool: '255,225,140', root: 36.7 },
];

// enemy weights per floor (index 0 = floor 1)
const FLOOR_MIX = [
  { crawler: 6, mite: 2 },
  { crawler: 4, mite: 3, wisp: 2, spitter: 1, snuffer: 1 },
  { crawler: 3, mite: 3, wisp: 2, spitter: 2, brute: 1, snuffer: 2, bloat: 1 },
  { crawler: 2, mite: 3, wisp: 2, spitter: 2, brute: 2, mirror: 1, snuffer: 2, bloat: 2, weaver: 1 },
  { crawler: 2, mite: 3, wisp: 2, spitter: 3, brute: 2, mirror: 2, snuffer: 2, bloat: 2, weaver: 2 },
  { crawler: 2, mite: 2, wisp: 2, spitter: 2, brute: 3, mirror: 3, snuffer: 2, bloat: 2, weaver: 2 },
];
const ENDLESS_MIX = { crawler: 2, mite: 2, wisp: 2, spitter: 2, brute: 3, mirror: 3, snuffer: 3, bloat: 3, weaver: 3 };
const TEST_SPAWN_ORDER = ['crawler', 'wisp', 'mite', 'brute', 'spitter', 'mirror', 'snuffer', 'bloat', 'weaver'];
// floors 1-6 are the main descent; floor 7+ is endless ("Descend Further"): depth = floor - 6, biomes and bosses remix
function bioIdx(f) { return f <= 6 ? Math.max(0, f - 1) : (f - 7) % 6; }
function biomeFor(f) { if (f <= 6) return BIOMES[f - 1]; const i = bioIdx(f), b = BIOMES[i]; return Object.assign({}, b, { name: b.name + ' Remix', sub: 'Depth ' + (f - 6) + ' — the dark remembers this place', fi: i }); }
function bossFor(f) { if (f <= 6) return CONFIG.bossFloors[f]; const d = f - 6; return d % 2 === 0 ? ['moth', 'bell', 'gloam', 'king'][(d / 2 - 1) % 4] : undefined; }
function mixFor(f) { return f <= 6 ? FLOOR_MIX[f - 1] : ENDLESS_MIX; }
function hasShop(f) { return (f >= 2 && f <= 5) || (f > 6 && (f - 6) % 2 === 1); }
function floorText(f) { return f <= 6 ? 'Floor ' + f + '/' + CONFIG.floors : 'Depth ' + (f - 6); }
function diffK(k) { const D = typeof DIFFS !== 'undefined' && typeof Game !== 'undefined' ? DIFFS[Game.diff] : null; return D ? D[k] : 1; }

// ---------------------------------------------------------------- UTIL
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const len = (x, y) => Math.hypot(x, y);
const easeOut = t => 1 - (1 - t) * (1 - t);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const hash2 = (x, y) => { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); };
function weightedPick(weights) {
  let tot = 0; for (const k in weights) tot += weights[k];
  let r = Math.random() * tot; for (const k in weights) { r -= weights[k]; if (r <= 0) return k; }
  return Object.keys(weights)[0];
}

// ---------------------------------------------------------------- SETTINGS
const Settings = {
  scheme: 'A', shake: true, sound: true, master: 0.8, music: 0.7, sfx: 0.9, reduceFlash: false, touchScale: 1, aimAssist: true, vibrate: true, cbSafe: false, bigText: false, autoFire: true, stickFixed: false, moveFeel: 'snappy',
  KEYS: ['scheme', 'shake', 'sound', 'master', 'music', 'sfx', 'reduceFlash', 'touchScale', 'aimAssist', 'vibrate', 'cbSafe', 'bigText', 'autoFire', 'stickFixed', 'moveFeel'],
  load() { try { const s = JSON.parse(localStorage.getItem('lanternfall.settings') || '{}'); for (const k of this.KEYS) if (s[k] !== undefined && typeof s[k] === typeof this[k]) this[k] = s[k]; } catch (e) { /* storage blocked */ } },
  save() { try { const o = {}; for (const k of this.KEYS) o[k] = this[k]; localStorage.setItem('lanternfall.settings', JSON.stringify(o)); } catch (e) { /* ignore */ } },
};
Settings.load();

// ---------------------------------------------------------------- CANVAS
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dark = document.createElement('canvas');
const dctx = dark.getContext('2d');
let VW = 960, VH = 640, DPR = 1, ZOOM = 1, UI = 1, UW = 960, UH = 640;
const SAFE = { t: 0, r: 0, b: 0, l: 0 };
function readSafeArea() {
  try { const el = document.getElementById('safe'); if (!el) return; const cs = getComputedStyle(el); SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0; SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0; } catch (e) { /* ignore */ }
}
let TOUCH_UI = false, MASK = 1; // MASK: light-mask resolution (perf governor lowers it)
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = window.innerWidth || 960; VH = window.innerHeight || 640;
  canvas.width = Math.floor(VW * DPR); canvas.height = Math.floor(VH * DPR);
  dark.width = Math.floor(canvas.width * MASK); dark.height = Math.floor(canvas.height * MASK);
  const m = Math.min(VW, VH);
  ZOOM = clamp(m / 620, 0.6, 1);      // world zoom: phones see a bit more of the cave
  UI = clamp(m / 720, 0.6, 1.15);     // HUD scale
  if (TOUCH_UI) UI = clamp(Math.max(UI, Math.min(m / 470, 0.95)) * Settings.touchScale, 0.6, 1.6); // phones: larger by default, user slider
  if (Settings.bigText) UI = Math.min(UI * 1.2, 1.9); // Polish 3: larger text option scales every menu and HUD
  readSafeArea();
  UW = (VW - SAFE.l - SAFE.r) / UI; UH = (VH - SAFE.t - SAFE.b) / UI; // HUD lives inside notch-safe area
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(() => { resize(); if (typeof TouchPad !== 'undefined') TouchPad.reset(); }, 120));
resize();

// ---------------------------------------------------------------- INPUT
const Input = {
  down: new Set(), pressed: new Set(),
  mouse: { x: 0, y: 0, down: false, moved: false },
  norm(e) { return e.key.length === 1 ? e.key.toLowerCase() : e.key; },
  init() {
    window.addEventListener('keydown', e => {
      const k = this.norm(e), c = e.code ? '#' + e.code : ''; /* '#KeyW' etc: physical keys, so WASD also works on AZERTY / other layouts */
      if (!this.down.has(k)) this.pressed.add(k);
      this.down.add(k); if (c) this.down.add(c);
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.key)) e.preventDefault();
      Sfx.unlock();
    });
    window.addEventListener('keyup', e => { this.down.delete(this.norm(e)); if (e.code) this.down.delete('#' + e.code); });
    const lost = () => { this.down.clear(); this.mouse.down = false; if (typeof TouchPad !== 'undefined') TouchPad.reset(); if (Game.state === 'play') Game.openMenu(); };
    window.addEventListener('blur', lost);
    document.addEventListener('visibilitychange', () => { if (document.hidden) lost(); }); /* phones: app switch / lock screen pauses too */
    canvas.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      this.mouse.x = e.clientX - r.left; this.mouse.y = e.clientY - r.top; this.mouse.moved = true; this.mouse.fresh = true;
    });
    canvas.addEventListener('mousedown', e => { if (e.button === 0) { this.mouse.down = true; this.pressed.add('mouse'); } else if (e.button === 2) this.pressed.add('dash'); /* right-click dashes */ Sfx.unlock(); });
    window.addEventListener('mouseup', e => { if (e.button === 0) this.mouse.down = false; });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault()); /* no long-press menu on phones */
  },
  isDown(...keys) { return keys.some(k => this.down.has(k)); },
  wasPressed(...keys) { return keys.some(k => this.pressed.has(k)); },
  endFrame() { this.pressed.clear(); this.mouse.fresh = false; },
};

// ---------------------------------------------------------------- AUDIO
const Sfx = {
  ac: null, master: null, sfx: null, music: null, noiseBuf: null, enabled: true, last: {}, drones: [],
  unlock() {
    if (this.ac) { if (this.ac.state === 'suspended') this.ac.resume(); return; }
    if (!this.enabled) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled = false; return; }
    try {
      this.ac = new AC();
      this.master = this.ac.createGain(); this.master.gain.value = Settings.sound ? 0.55 : 0; this.master.connect(this.ac.destination);
      this.sfx = this.ac.createGain(); this.sfx.gain.value = 0.9; this.sfx.connect(this.master);
      this.music = this.ac.createGain(); this.music.gain.value = 0.22; this.music.connect(this.master);
      const n = this.ac.sampleRate; this.noiseBuf = this.ac.createBuffer(1, n, n);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      this.startDrone();
    } catch (err) { this.enabled = false; this.ac = null; }
  },
  applyVolume() { if (this.master) this.master.gain.setTargetAtTime(Settings.sound ? 0.55 : 0, this.ac.currentTime, 0.05); },
  gate(name, gap) { const t = performance.now(); if (this.last[name] && t - this.last[name] < gap) return false; this.last[name] = t; return true; },
  toneT(type, f0, f1, dur, vol, t, dest) {
    if (!this.ac) return;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  noiseT(dur, vol, freq, q, type, t, dest) {
    if (!this.ac) return;
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq; f.Q.value = q || 1;
    const g = this.ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest || this.sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  },
  duck(on) { if (this.music) this.music.gain.setTargetAtTime(on ? 0.04 : 0.22, this.ac.currentTime, 0.4); },
  tone(type, f0, f1, dur, vol, delay) {
    if (!this.ac) return; const t = this.ac.currentTime + (delay || 0);
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    const pv = this.pv || 1; vol *= this.vv || 1; o.type = type; o.frequency.setValueAtTime(f0 * pv, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1 * pv), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  noise(dur, vol, freq, q, type, delay) {
    if (!this.ac) return; const t = this.ac.currentTime + (delay || 0);
    const s = this.ac.createBufferSource(); s.buffer = this.noiseBuf;
    const f = this.ac.createBiquadFilter(); f.type = type || 'bandpass'; f.frequency.value = freq * (this.pv || 1); f.Q.value = q || 1;
    const g = this.ac.createGain(); g.gain.setValueAtTime(vol * (this.vv || 1), t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfx); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
  },
  arp(notes, step, type, vol) { notes.forEach((f, i) => this.tone(type || 'sine', f, f * 1.01, step * 2.2, vol || 0.08, i * step)); },
  play(name) {
    if (!this.ac) return;
    switch (name) {
      case 'shoot': if (!this.gate(name, 45)) return; this.tone('triangle', rand(880, 960), 420, 0.09, 0.11); this.noise(0.05, 0.05, 3000, 2); break;
      case 'hit': if (!this.gate(name, 30)) return; this.tone('square', 220, 90, 0.07, 0.07); this.noise(0.06, 0.11, 1400, 1.5); break;
      case 'kill': if (!this.gate(name, 40)) return; this.tone('sawtooth', 300, 50, 0.22, 0.09); this.noise(0.25, 0.16, 700, 0.8, 'lowpass'); break;
      case 'dash': this.noise(0.18, 0.2, 900, 0.6); this.tone('sine', 180, 520, 0.14, 0.08); break;
      case 'hurt': this.tone('sawtooth', 160, 60, 0.3, 0.15); this.noise(0.2, 0.2, 400, 1, 'lowpass'); break;
      case 'empty': if (!this.gate(name, 200)) return; this.tone('sine', 140, 110, 0.08, 0.06); break;
      case 'death': this.tone('sine', 440, 40, 1.6, 0.2); this.tone('triangle', 330, 30, 1.8, 0.12); this.noise(1.2, 0.15, 300, 0.5, 'lowpass'); break;
      case 'start': this.arp([330, 495, 660], 0.11, 'sine', 0.1); break;
      case 'shard': if (!this.gate(name, 50)) return; this.tone('sine', 660, 990, 0.1, 0.07); break;
      case 'oil': this.arp([392, 523, 784], 0.07, 'triangle', 0.09); break;
      case 'ember': if (!this.gate(name, 45)) return; this.tone('triangle', rand(1150, 1300), 1700, 0.06, 0.05); break;
      case 'seal': this.noise(0.45, 0.32, 260, 0.7, 'lowpass'); this.tone('square', 90, 45, 0.35, 0.1); break;
      case 'open': this.tone('sine', 220, 440, 0.35, 0.09); this.noise(0.3, 0.08, 1200, 0.8); break;
      case 'clear': this.arp([523, 659, 784, 1046], 0.08, 'triangle', 0.08); break;
      case 'stairs': this.arp([262, 330, 392, 523, 659], 0.12, 'sine', 0.1); break;
      case 'floor': this.tone('sine', 110, 108, 2.2, 0.16); this.tone('sine', 165, 163, 2.0, 0.08, 0.05); this.tone('sine', 220, 218, 1.6, 0.05, 0.1); break;

// enemy spawn telegraph

// spitter projectile: lobbed arc, lands on telegraphed target
class Glob extends Entity {

// ------------------------------------------------ ENEMIES
class Enemy extends Entity {
  constructor(x, y, type, game) {
    const T = ENEMY_TYPES[type]; super(x, y, T.r);
    const f = game ? game.floor : 1;
    const ehp = game && game.player && game.player.mods ? game.player.mods.enemyHp : 1;
    this.type = type; this.T = T; const fm = Math.min(f, 6), dep = Math.max(0, f - 6); /* endless: +10% HP / +7% damage per depth on top of floor 6 */
    this.hp = this.maxHp = Math.round(T.hp * (1 + 0.18 * (fm - 1)) * (1 + 0.10 * dep) * ehp * diffK('hp'));
    this.dmgMul = (1 + 0.12 * (fm - 1)) * (1 + 0.07 * dep) * diffK('dmg'); this.touchCd = 0; this.spawnT = 0.45; this.wob = Math.random() * TAU; this.hpShow = 0;
    this.mass = T.r * T.r; this.knockResist = T.knockResist || 1; this.room = null; this.state = 'idle'; this.st = 0;
    this.contact = T.damage; this.orbit = Math.random() < 0.5 ? 1 : -1;
  }
  get damage() { return this.contact * this.dmgMul; }
  setState(s) { this.state = s; this.st = 0; }
  update(dt, game) {
    this.spawnT -= dt; this.touchCd -= dt; this.flash = Math.max(0, this.flash - dt * 7); this.hpShow -= dt; this.wob += dt * (4 + len(this.vx, this.vy) / 22); this.st += dt; // walk cycle speeds up with movement
    const p = game.player; this.dx = p.x - this.x; this.dy = p.y - this.y; this.dist = len(this.dx, this.dy) || 1; this.nx = this.dx / this.dist; this.ny = this.dy / this.dist;
    if (this.spawnT > 0 || game.state !== 'play') { this.vx *= 0.85; this.vy *= 0.85; } else this.think(dt, game);
    this.x += this.vx * dt; this.y += this.vy * dt; this.hitWall = this.noclip ? false : Dungeon.collide(this);
    if (game.state === 'play' && this.spawnT <= 0 && this.touchCd <= 0 && this.contact > 0 && !this.intangible && this.dist < this.r + p.r) this.onTouch(game);
  }
  think(dt, game) {}
  steer(tx, ty, spd, rate, dt) { const l = len(tx, ty) || 1, k = Math.min(1, rate * dt); this.vx += (tx / l * spd - this.vx) * k; this.vy += (ty / l * spd - this.vy) * k; }
  onTouch(game) { if (game.player.hurt(this.damage, this.x, this.y, game)) { this.touchCd = 0.6; this.vx = -this.nx * 300; this.vy = -this.ny * 300; } }
  damageMul() { return 1; }
  takeHit(dmg, src, game) {
    if (this.spawnT > 0.2) dmg *= 0.5;
    dmg *= this.damageMul();
    const crit = Math.random() < 0.12 + (game.player ? game.player.mods.crit : 0); if (crit) { dmg *= 2; if (!src.quiet) { FX.hitStop = Math.max(FX.hitStop, 0.045); Sfx.play('hitcrit'); } }
    this.hp -= dmg; this.flash = 1; this.hpShow = 1.5;
    const a = Math.atan2(src.vy, src.vx), kb = src.quiet ? 0 : CONFIG.bolt.knock * this.knockResist * (src.knock || 1);
    this.vx += Math.cos(a) * kb; this.vy += Math.sin(a) * kb;
    FX.text(this.x, this.y - this.r - 6, (crit ? '!' : '') + Math.round(dmg), crit ? '#ffe14a' : '#ffffff', crit);
    FX.burst(this.x, this.y, crit ? 10 : 6, this.T.color, 180, 0.3, 2.5);
    if (!src.quiet) { Camera.addShake(crit ? 0.13 : 0.06); Sfx.play('hit'); }
    this.onHit(game);
    if (this.hp <= 0 && !this.dead) this.die(game);
  }
  onHit(game) {}
  die(game) {
    this.dead = true; game.player.kills++;
    if (game.player.mods.lifesteal && !game.player.lanternStolen) { game.player.gain(game.player.mods.lifesteal); FX.text(game.player.x, game.player.y - 18, '+' + game.player.mods.lifesteal, '#ff9ab0'); }
    FX.burst(this.x, this.y, 10 + this.r, this.T.color, 280, 0.6, 4); FX.burst(this.x, this.y, 8, '#0e0a16', 200, 0.8, 6);
    Camera.addShake(0.12 + this.r / 120); FX.hitStop = Math.max(FX.hitStop, this.r > 20 ? 0.08 : 0.04); Sfx.play('kill'); FX.dissolve(this);
    for (const [kind, chance, count] of this.T.drops) if (Math.random() < chance) for (let i = 0; i < count; i++) game.pickups.push(new Pickup(this.x, this.y, kind));
    this.onDeath(game);
  }
  onDeath(game) {}
  drawHp(c, sx, sy) {
    if (this.hpShow <= 0 || this.hp >= this.maxHp) return;
    const w = Math.max(28, this.r * 2.2); c.globalAlpha = Math.min(1, this.hpShow);
    c.fillStyle = '#000'; c.fillRect(sx - w / 2 - 1, sy - this.r - 13, w + 2, 5);
    c.fillStyle = this.T.color; c.fillRect(sx - w / 2, sy - this.r - 12, w * clamp(this.hp / this.maxHp, 0, 1), 3);
    c.globalAlpha = 1;
  }
  emerge() { return clamp(1 - this.spawnT / 0.45, 0, 1); }
  eyes(c, sx, sy, col, sep, r) { c.fillStyle = this.flash > 0 ? '#fff' : col; c.beginPath(); c.arc(sx - sep, sy - 3, r, 0, TAU); c.arc(sx + sep, sy - 3, r, 0, TAU); c.fill(); }
  drawTelegraph(c) {}
}

class ShadeCrawler extends Enemy {
  constructor(x, y, game) { super(x, y, 'crawler', game); this.fear = 0; }
  think(dt, game) {
    const p = game.player, core = p.radiusLight * CONFIG.light.coreFrac;
    this.fear = lerp(this.fear, this.dist < core ? 1 : 0, 1 - Math.exp(-dt * 5));

    if (this.fear > 0.5 && p.light > 15) this.steer(-this.nx - this.ny * this.orbit * 0.8, -this.ny + this.nx * this.orbit * 0.8, this.T.speed * 1.4, 3, dt);
    else this.steer(this.nx - this.ny * this.orbit * 0.35, this.ny + this.nx * this.orbit * 0.35, this.T.speed * brave, 3, dt);
  }

    for (let i = 0; i < 6; i++) { const a = (i / 6) * TAU + Math.sin(this.wob + i) * 0.25; c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + Math.cos(a) * r * 1.6, sy + Math.sin(a) * r * 1.6); c.stroke(); }

class WispThief extends Enemy {
  constructor(x, y, game) { super(x, y, 'wisp', game); this.held = 0; this.lunge = { x: 0, y: 0 }; this.setState('stalk'); this.cd = rand(0.8, 1.6); }
  think(dt, game) {
    const p = game.player, T = this.T;
    if (this.state === 'stalk') {
      this.cd -= dt;
      const want = 150, radial = this.dist > want ? 1 : -0.6;
      this.steer(this.nx * radial - this.ny * this.orbit, this.ny * radial + this.nx * this.orbit, T.speed * 0.8, 4, dt);
      if (this.cd <= 0 && this.dist < 260 && this.held === 0) { this.setState('windup'); Sfx.play('wispwind'); }
    } else if (this.state === 'windup') {
      this.vx *= 0.9; this.vy *= 0.9;
      if (this.st > 0.5) { this.lunge = { x: this.nx, y: this.ny }; this.setState('lunge'); }
    } else if (this.state === 'lunge') {
      this.vx = this.lunge.x * 520; this.vy = this.lunge.y * 520;
      if (this.dist < this.r + p.r + 4) {
        const n = p.steal(T.steal * this.dmgMul, game);
        if (n > 0) { this.held += n; FX.burst(p.x, p.y, 12, '#7ff0ff', 200, 0.4, 3); }
        this.setState('flee');
      } else if (this.st > 0.4) { this.setState('stalk'); this.cd = rand(1.2, 2); }
    } else if (this.state === 'flee') {
      this.steer(-this.nx + this.ny * this.orbit * 0.5, -this.ny - this.nx * this.orbit * 0.5, T.speed * 1.15, 5, dt);
      if (this.st > 4) { this.setState('stalk'); this.cd = rand(1.5, 2.5); }
    }
  }
  onDeath(game) {
    const n = Math.round(this.held / 5);
    for (let i = 0; i < n; i++) game.pickups.push(new Pickup(this.x, this.y, 'shard'));
    if (this.held > 0) FX.text(this.x, this.y - 18, 'light reclaimed!', '#7ff0ff', true);
  }
  draw(c) {
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y) + Math.sin(this.wob * 0.5) * 3, em = this.emerge();
    c.globalAlpha = em * 0.9;
    for (let i = 0; i < 4; i++) { c.fillStyle = `rgba(127,240,255,${0.15 - i * 0.03})`; c.beginPath(); c.arc(sx - this.vx * 0.02 * i, sy - this.vy * 0.02 * i, this.r + i * 2, 0, TAU); c.fill(); }
    c.fillStyle = this.flash > 0 ? '#fff' : (this.held > 0 ? '#ffe48a' : '#bff8ff'); c.beginPath(); c.arc(sx, sy, this.r * 0.7, 0, TAU); c.fill();
    c.fillStyle = '#0a1a22'; c.beginPath(); c.arc(sx - 3, sy - 1, 1.6, 0, TAU); c.arc(sx + 3, sy - 1, 1.6, 0, TAU); c.fill();
    c.globalAlpha = 1; this.drawHp(c, sx, sy);
  }
  drawTelegraph(c) {
    if (this.state !== 'windup') return;
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y), f = clamp(this.st / 0.5, 0, 1);
    c.save(); c.strokeStyle = `rgba(127,240,255,${0.5 + f * 0.5})`; c.lineWidth = 2;
    c.beginPath(); c.arc(sx, sy, 30 - f * 18, 0, TAU); c.stroke();
    c.setLineDash([4, 6]); c.beginPath(); c.moveTo(sx, sy); c.lineTo(sx + this.nx * 90, sy + this.ny * 90); c.stroke(); c.restore();
  }
}

class Mite extends Enemy {
  constructor(x, y, game, type) { super(x, y, type || 'mite', game); this.spawnT = 0.3; }
  think(dt, game) {
    let cx = 0, cy = 0, ax = 0, ay = 0, sx = 0, sy = 0, n = 0;
    for (const o of game.enemies) {
      if (o === this || o.type !== this.type || o.dead) continue;
      const dx = o.x - this.x, dy = o.y - this.y, d = len(dx, dy);
      if (d < 80) { n++; cx += dx; cy += dy; ax += o.vx; ay += o.vy; if (d < 18 && d > 0) { sx -= dx / d * (18 - d); sy -= dy / d * (18 - d); } }
    }
    let tx = this.nx * 1.2, ty = this.ny * 1.2;
    tx += Math.cos(this.wob * 0.3) * 0.4; ty += Math.sin(this.wob * 0.37) * 0.4;
    if (n) { tx += cx / n / 80 * 0.6 + ax / n / this.T.speed * 0.5 + sx * 0.08; ty += cy / n / 80 * 0.6 + ay / n / this.T.speed * 0.5 + sy * 0.08; }
    this.steer(tx, ty, this.T.speed, 4, dt);
  }
  onTouch(game) { if (game.player.hurt(this.damage, this.x, this.y, game)) { this.touchCd = 0.8; this.vx = -this.nx * 250; this.vy = -this.ny * 250; } }
  draw(c) {

    c.globalAlpha = em;
    const wing = Math.sin(this.wob * 3) * 3;
    c.fillStyle = 'rgba(255,230,160,0.35)'; c.beginPath(); c.ellipse(sx - 4, sy - 2, 4, 2 + wing * 0.3, -0.5, 0, TAU); c.ellipse(sx + 4, sy - 2, 4, 2 + wing * 0.3, 0.5, 0, TAU); c.fill();
    c.fillStyle = this.flash > 0 ? '#fff' : '#3a2a10'; c.beginPath(); c.arc(sx, sy, this.r, 0, TAU); c.fill();
    c.fillStyle = this.flash > 0 ? '#fff' : this.T.color; c.beginPath(); c.arc(sx + this.nx * 2, sy + this.ny * 2, 1.6, 0, TAU); c.fill();
    c.globalAlpha = 1;
  }
}

class Brute extends Enemy {
  constructor(x, y, game) { super(x, y, 'brute', game); this.setState('walk'); this.cd = rand(1, 2); this.cdir = { x: 1, y: 0 }; this.contact = this.T.damage * 0.5; }
  damageMul() { return this.state === 'stunned' ? 1.75 : 1; }
  think(dt, game) {
    const T = this.T;
    if (this.state === 'walk') {
      this.cd -= dt; this.contact = T.damage * 0.5;
      this.steer(this.nx, this.ny, T.speed, 2, dt);
      if (this.cd <= 0 && this.dist < 330) { this.setState('windup'); Sfx.play('windup'); }
    } else if (this.state === 'windup') {
      this.vx *= 0.85; this.vy *= 0.85;
      if (this.st < 0.55) this.cdir = { x: this.nx, y: this.ny }; // tracks, then locks for the last 0.3s
      if (this.st > 0.85) { this.setState('charge'); Sfx.play('charge'); Camera.addShake(0.15); }
    } else if (this.state === 'charge') {
      this.contact = T.damage;
      this.vx = this.cdir.x * 600; this.vy = this.cdir.y * 600;
      if (Math.random() < 0.6) FX.burst(this.x - this.cdir.x * 20, this.y - this.cdir.y * 20, 1, '#5a3a2a', 80, 0.4, 5);
      if (this.hitWall && this.st > 0.05) { this.setState('stunned'); Sfx.play('stun'); Camera.addShake(0.4); FX.burst(this.x + this.cdir.x * 20, this.y + this.cdir.y * 20, 22, '#c8a080', 260, 0.5, 4); FX.text(this.x, this.y - 34, 'STUNNED', '#ffe14a', true); this.vx = -this.cdir.x * 120; this.vy = -this.cdir.y * 120; }
      else if (this.st > 0.7) this.setState('recover');
    } else if (this.state === 'stunned') {
      this.contact = 0; this.vx *= 0.9; this.vy *= 0.9;

    } else if (this.state === 'recover') {
      this.contact = T.damage * 0.5; this.vx *= 0.88; this.vy *= 0.88;
      if (this.st > 0.6) { this.setState('walk'); this.cd = rand(1, 1.8); }
    }
  }
  onTouch(game) { if (game.player.hurt(this.damage, this.x, this.y, game)) { this.touchCd = 0.8; if (this.state === 'charge') this.setState('recover'); } }
  draw(c) {
    const em = this.emerge(), shake = this.state === 'windup' ? rand(-2, 2) * (this.st / 0.85) : 0;
    const sx = Camera.sx(this.x) + shake, sy = Camera.sy(this.y), r = this.r * (0.4 + 0.6 * em);
    c.globalAlpha = em; drawShadow(c, sx, sy, r);
    c.fillStyle = this.flash > 0 ? '#fff' : (this.state === 'windup' ? '#4a1a14' : '#2a1a18');
    c.beginPath(); c.arc(sx, sy, r, 0, TAU); c.fill();
    c.fillStyle = this.flash > 0 ? '#fff' : '#3a2620';
    c.beginPath(); c.arc(sx - r * 0.75, sy - r * 0.3, r * 0.45, 0, TAU); c.arc(sx + r * 0.75, sy - r * 0.3, r * 0.45, 0, TAU); c.fill();
    // maw
    const ma = Math.atan2(this.ny, this.nx);
    c.fillStyle = '#000'; c.beginPath(); c.arc(sx + Math.cos(ma) * r * 0.45, sy + Math.sin(ma) * r * 0.45, r * 0.38, 0, TAU); c.fill();
    c.fillStyle = this.state === 'stunned' ? '#888' : '#ff5a3a';
    c.beginPath(); c.arc(sx + Math.cos(ma - 0.6) * r * 0.6, sy + Math.sin(ma - 0.6) * r * 0.6 - 2, 2.6, 0, TAU); c.arc(sx + Math.cos(ma + 0.6) * r * 0.6, sy + Math.sin(ma + 0.6) * r * 0.6 - 2, 2.6, 0, TAU); c.fill();
    if (this.state === 'stunned') { c.fillStyle = '#ffe14a'; for (let i = 0; i < 3; i++) { const a = this.st * 5 + i * TAU / 3; c.beginPath(); c.arc(sx + Math.cos(a) * 16, sy - r - 6 + Math.sin(a) * 4, 2.5, 0, TAU); c.fill(); } }
    c.globalAlpha = 1; this.drawHp(c, sx, sy);
  }
  drawTelegraph(c) {
    if (this.state !== 'windup') return;
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y), f = clamp(this.st / 0.85, 0, 1), L = 380, w = this.r;
    const px = -this.cdir.y, py = this.cdir.x;

    c.beginPath(); c.moveTo(sx + px * w, sy + py * w); c.lineTo(sx + this.cdir.x * L + px * w * 0.6, sy + this.cdir.y * L + py * w * 0.6);
    c.lineTo(sx + this.cdir.x * L - px * w * 0.6, sy + this.cdir.y * L - py * w * 0.6); c.lineTo(sx - px * w, sy - py * w); c.closePath(); c.fill();
    c.strokeStyle = f > 0.65 ? '#ff4a3a' : 'rgba(255,120,90,0.8)'; c.lineWidth = f > 0.65 ? 3 : 1.5; c.stroke();
    c.restore();
  }
}

class Spitter extends Enemy {
  constructor(x, y, game) { super(x, y, 'spitter', game); this.setState('move'); this.cd = rand(1, 2); this.target = null; }
  think(dt, game) {
    const p = game.player, T = this.T;
    if (this.state === 'move') {
      this.cd -= dt;
      const radial = this.dist < 240 ? -1 : this.dist > 380 ? 1 : 0;
      this.steer(this.nx * radial - this.ny * this.orbit * 0.7, this.ny * radial + this.nx * this.orbit * 0.7, T.speed, 3, dt);
      if (this.cd <= 0 && this.dist < 520) { this.setState('aim'); Sfx.play('spitwind'); }
    } else if (this.state === 'aim') {
      this.vx *= 0.85; this.vy *= 0.85;

        let tx = p.x + p.vx * 0.55, ty = p.y + p.vy * 0.55;
        if (Dungeon.pointSolid(tx, ty)) { tx = p.x; ty = p.y; }
        this.target = { x: tx, y: ty };
      }

class MirrorShade extends Enemy {
  constructor(x, y, game) { super(x, y, 'mirror', game); this.setState('circle'); this.cd = rand(2.5, 4); this.ddir = { x: 1, y: 0 }; this.copyT = -1; this.copyTarget = null; this.after = []; }
  queueCopy(tx, ty) { if (this.state === 'circle' && this.spawnT <= 0) { this.copyTarget = { x: tx, y: ty }; this.setState('copy'); } }
  startDash(tx, ty) {
    const dx = tx - this.x, dy = ty - this.y, d = len(dx, dy) || 1; this.ddir = { x: dx / d, y: dy / d };
    let free = 0; while (free < Math.min(300, d + 30) && !Dungeon.pointSolid(this.x + this.ddir.x * (free + this.r + 4), this.y + this.ddir.y * (free + this.r + 4))) free += 6; // raycast so it never dashes face-first into a wall
    if (free < 30) { this.setState('circle'); this.cd = rand(0.8, 1.4); return; }
    this.dashLimit = free; this.dashDur = clamp(d / 620, 0.2, 0.42); /* lunge length scales to the target so it can actually connect */ this.dashFrom = { x: this.x, y: this.y }; this.setState('dash'); Sfx.play('mirror');
  }
  think(dt, game) {
    const T = this.T;
    for (const a of this.after) a.life -= dt; this.after = this.after.filter(a => a.life > 0);
    if (this.state === 'circle') {
      this.cd -= dt; this.contact = T.damage * 0.5;
      const radial = this.dist > 210 ? 0.8 : this.dist < 150 ? -0.8 : 0;
      this.steer(this.nx * radial - this.ny * this.orbit, this.ny * radial + this.nx * this.orbit, T.speed, 3, dt);
      if (this.cd <= 0) { this.copyTarget = { x: game.player.x, y: game.player.y }; this.setState('copy'); this.selfDash = true; }
    } else if (this.state === 'copy') { // telegraph before echoing
      this.vx *= 0.85; this.vy *= 0.85;
      if (this.st > (this.selfDash ? 0.5 : 0.28)) { this.startDash(this.copyTarget.x, this.copyTarget.y); this.selfDash = false; }
    } else if (this.state === 'dash') {
      this.contact = T.damage; const dd = this.dashDur || 0.2, k = easeOut(clamp(1 - this.st / dd, 0, 1));
      this.vx = this.ddir.x * lerp(260, 800, k); this.vy = this.ddir.y * lerp(260, 800, k);
      this.after.push({ x: this.x, y: this.y, life: 0.3 });
      if (this.st > dd || len(this.x - this.dashFrom.x, this.y - this.dashFrom.y) >= this.dashLimit) { this.vx *= 0.3; this.vy *= 0.3; this.setState('circle'); this.cd = rand(2.8, 4.2); this.orbit *= -1; }
    }
  }
  draw(c) {
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y), em = this.emerge();
    for (const a of this.after) { c.globalAlpha = a.life * 1.5; c.fillStyle = '#9fb8ff'; c.beginPath(); c.arc(Camera.sx(a.x), Camera.sy(a.y), this.r * 0.9, 0, TAU); c.fill(); }
    c.globalAlpha = em; drawShadow(c, sx, sy, this.r);
    const shimmer = 0.5 + 0.5 * Math.sin(this.wob * 0.7);
    c.fillStyle = this.flash > 0 || this.state === 'copy' ? '#ffffff' : `rgb(${190 + 40 * shimmer | 0},${205 + 30 * shimmer | 0},255)`;
    c.beginPath(); c.arc(sx, sy, this.r, 0, TAU); c.fill(); c.strokeStyle = '#5a6a9a'; c.lineWidth = 2; c.stroke();
    const fa = Math.atan2(this.ny, this.nx);
    c.fillStyle = '#3a4570'; c.beginPath(); c.arc(sx + Math.cos(fa) * 4, sy + Math.sin(fa) * 4, this.r * 0.55, 0, TAU); c.fill();
    c.fillStyle = '#c8d8ff'; c.beginPath(); c.arc(sx + Math.cos(fa) * 16, sy + Math.sin(fa) * 16, 4.5, 0, TAU); c.fill();
    c.globalAlpha = 1; this.drawHp(c, sx, sy);
  }
  drawTelegraph(c) {
    if (this.state !== 'copy' || !this.copyTarget) return;
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y), tx = Camera.sx(this.copyTarget.x), ty = Camera.sy(this.copyTarget.y);
    c.save(); c.strokeStyle = 'rgba(200,216,255,0.85)'; c.lineWidth = 2; c.setLineDash([8, 6]);
    c.beginPath(); c.moveTo(sx, sy); c.lineTo(tx, ty); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(tx, ty, 12, 0, TAU); c.stroke(); c.restore();
  }
}

// ---------------------------------------------------------------- BOSS MUSIC
// Procedural step sequencer on its own bus. Tempo + layers rise per phase.
const BOSS_MUSIC = {
  moth: { root: 110, bpm: 92, scale: [0, 3, 5, 7, 10], bass: [0, 0, 7, 0, 5, 0, 3, 0], wave: 'triangle' },
  bell: { root: 98, bpm: 74, scale: [0, 2, 3, 7, 8], bass: [0, 0, 0, 8, 0, 0, 7, 0], wave: 'sine', bell: true },
  gloam: { root: 73.4, bpm: 112, scale: [0, 1, 6, 7, 10], bass: [0, 0, 1, 0, 0, 6, 0, 1], wave: 'sawtooth' },
  king: { root: 82.4, bpm: 100, scale: [0, 3, 5, 7, 8, 11], bass: [0, 0, 5, 0, 3, 0, 7, 8], wave: 'square', bell: true },
};
const Music = {
  on: false, def: null, key: null, phase: 0, next: 0, step: 0, bus: null,
  ensureBus() { if (Sfx.ac && !this.bus) { this.bus = Sfx.ac.createGain(); this.bus.gain.value = 0.32; this.bus.connect(Sfx.music || Sfx.master); } return !!this.bus; },
  start(key) { this.key = key; this.def = BOSS_MUSIC[key]; this.phase = 0; this.step = 0; this.on = true; if (Sfx.ac) this.next = Sfx.ac.currentTime + 0.15; Sfx.duck(true); },
  stop() { this.on = false; Sfx.duck(false); },
  setPhase(p) { this.phase = p; },
  update() {
    if (!this.on || !Sfx.ac || !this.ensureBus()) return;
    const ac = Sfx.ac, spb = 60 / (this.def.bpm * (1 + 0.12 * this.phase)) / 4;
    if (this.next < ac.currentTime) this.next = ac.currentTime + 0.05;
    while (this.next < ac.currentTime + 0.18) { this.playStep(this.step, this.next, spb); this.next += spb; this.step++; }
  },
  n(semi) { return this.def.root * Math.pow(2, semi / 12); },
  playStep(i, t, spb) {
    const d = this.def, s = i % 16, bar = (i / 16) | 0, P = this.phase, B = this.bus;
    if (s % 4 === 0 || (P >= 1 && s === 14)) Sfx.toneT('sine', 150, 38, 0.2, 0.32, t, B);
    if (P >= 1 && (s === 4 || s === 12)) Sfx.noiseT(0.12, 0.16, 1800, 0.9, 'bandpass', t, B);
    if (P >= 2 && s % 2 === 1) Sfx.noiseT(0.035, 0.05, 7000, 0.7, 'highpass', t, B);
    if (s % 2 === 0) { const b = d.bass[(s / 2) % 8]; Sfx.toneT(d.wave === 'sine' ? 'triangle' : d.wave, this.n(b - 12), this.n(b - 12) * 0.99, spb * 1.8, d.wave === 'square' || d.wave === 'sawtooth' ? 0.05 : 0.11, t, B); }
    if (P >= 1) { const sc = d.scale, k = sc[(i * 3 + bar) % sc.length]; Sfx.toneT('square', this.n(k + 12), this.n(k + 12), spb * 0.8, 0.018 + 0.006 * P, t, B); }
    if (d.bell && s === 0 && bar % (P >= 2 ? 1 : 2) === 0) { [1, 2.76, 5.4].forEach((m, j) => Sfx.toneT('sine', this.n(24) * m, this.n(24) * m, 1.6 - j * 0.4, 0.06 / (j + 1), t, B)); }
    if (P >= 2 && s % 4 === 2) { const sc = d.scale, k = sc[(bar * 5 + s) % sc.length]; Sfx.toneT('triangle', this.n(k + 24), this.n(k + 24), spb * 2.5, 0.035, t, B); }
  },
};

// ---------------------------------------------------------------- BOSS HAZARDS
// Each hazard: update(dt, game), draw(c) (under darkness), drawTelegraph(c) (over darkness).
class DustCone {
  constructor(owner, ang, width, length, delay, dmg) { this.owner = owner; this.x = owner.x; this.y = owner.y; this.ang = ang; this.w = width; this.len = length; this.delay = delay; this.dmg = dmg; this.t = 0; this.fired = false; this.dead = false; }
  update(dt, game) {
    this.t += dt;
    if (!this.fired && this.owner && !this.owner.dead) { this.x = this.owner.x; this.y = this.owner.y; }
    if (!this.fired && this.t >= this.delay) {
      this.fired = true; Sfx.play('dust'); Camera.addShake(0.12);
      for (let i = 0; i < 40; i++) { const a = this.ang + rand(-this.w / 2, this.w / 2), d = rand(10, this.len), s = rand(40, 120); FX.particles.push({ x: this.x + Math.cos(a) * d * 0.3, y: this.y + Math.sin(a) * d * 0.3, vx: Math.cos(a) * (d + s), vy: Math.sin(a) * (d + s), life: rand(0.5, 1), max: 1, color: '#e8dca0', size: rand(3, 7) }); }
      const p = game.player, dx = p.x - this.x, dy = p.y - this.y, d = len(dx, dy);
      let da = Math.atan2(dy, dx) - this.ang; da = Math.atan2(Math.sin(da), Math.cos(da));
      if (d < this.len + p.r && Math.abs(da) < this.w / 2) p.hurt(this.dmg, this.x, this.y, game);
    }
    if (this.t > this.delay + 0.4) this.dead = true;
  }
  draw(c) {}
  drawTelegraph(c) {
    if (this.fired) return;
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y), f = clamp(this.t / this.delay, 0, 1);
    c.save(); c.fillStyle = `rgba(232,220,160,${0.08 + 0.25 * f})`; c.strokeStyle = `rgba(255,240,180,${0.5 + 0.5 * f})`; c.lineWidth = f > 0.7 ? 3 : 1.5;
    c.beginPath(); c.moveTo(sx, sy); c.arc(sx, sy, this.len, this.ang - this.w / 2, this.ang + this.w / 2); c.closePath(); c.fill(); c.stroke();
    c.beginPath(); c.moveTo(sx, sy); c.arc(sx, sy, this.len * f, this.ang - this.w / 2, this.ang + this.w / 2); c.closePath(); c.fillStyle = 'rgba(255,240,180,0.15)'; c.fill();
    c.restore();
  }
}

class Shockwave {
  constructor(x, y, delay, speed, maxR, dmg, color) { this.x = x; this.y = y; this.delay = delay; this.speed = speed; this.maxR = maxR; this.dmg = dmg; this.r = 0; this.t = 0; this.band = 18; this.hit = false; this.dead = false; this.color = color || '111,200,255'; this.rang = false; }
  update(dt, game) {
    this.t += dt; if (this.t < this.delay) return;
    if (!this.rang) { this.rang = true; Sfx.play('bell'); Camera.addShake(0.2); }
    this.r += this.speed * dt;
    const p = game.player, d = len(p.x - this.x, p.y - this.y);
    const inGap = this.gapW > 0 && Math.abs(Math.atan2(Math.sin(Math.atan2(p.y - this.y, p.x - this.x) - this.gapAng), Math.cos(Math.atan2(p.y - this.y, p.x - this.x) - this.gapAng))) < this.gapW / 2;
    if (!this.hit && inGap && Math.abs(d - this.r) < this.band / 2 + p.r * 0.6 && !this.gapMsg) { this.gapMsg = true; FX.text(p.x, p.y - 26, 'through the gap!', '#bfe8ff'); }
    if (!this.hit && !inGap && Math.abs(d - this.r) < this.band / 2 + p.r * 0.6) { if (p.hurt(this.dmg, this.x, this.y, game)) this.hit = true; else if (p.dashT > 0 && !this.dodged) { this.dodged = true; FX.text(p.x, p.y - 26, 'dodged!', '#bfe8ff'); } }
    if (this.r > this.maxR || Dungeon.pointSolid(this.x, this.y) && this.r > 900) this.dead = true;
  }
  draw(c) {}
  drawTelegraph(c) {
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y);
    c.save();
    const g0 = this.gapW > 0 ? this.gapAng + this.gapW / 2 : 0, g1 = this.gapW > 0 ? this.gapAng - this.gapW / 2 + TAU : TAU;
    if (this.t < this.delay) {
      const f = this.t / this.delay; c.strokeStyle = `rgba(${this.color},${0.3 + 0.5 * f})`; c.lineWidth = 2; c.beginPath(); c.arc(sx, sy, 20 + 30 * f, g0, g1); c.stroke();
      if (this.gapW > 0) { // safe-lane marker: two bright rails pointing out through the gap
        c.strokeStyle = `rgba(200,255,220,${0.4 + 0.5 * f})`; c.lineWidth = 2; c.setLineDash([8, 8]);
        for (const s of [-1, 1]) { const a = this.gapAng + s * this.gapW / 2; c.beginPath(); c.moveTo(sx + Math.cos(a) * 50, sy + Math.sin(a) * 50); c.lineTo(sx + Math.cos(a) * 260, sy + Math.sin(a) * 260); c.stroke(); }
        c.setLineDash([]);
      }
    } else {
      const a = clamp(1 - this.r / this.maxR, 0.2, 1);
      c.strokeStyle = `rgba(${this.color},${0.85 * a})`; c.lineWidth = this.band; c.beginPath(); c.arc(sx, sy, this.r, g0, g1); c.stroke();
      c.strokeStyle = `rgba(255,255,255,${0.6 * a})`; c.lineWidth = 2; c.beginPath(); c.arc(sx, sy, this.r, g0, g1); c.stroke();
      if (this.gapW > 0) { c.fillStyle = `rgba(200,255,220,${0.7 * a})`; for (const s of [-1, 1]) { const q = this.gapAng + s * this.gapW / 2; c.beginPath(); c.arc(sx + Math.cos(q) * this.r, sy + Math.sin(q) * this.r, 4, 0, TAU); c.fill(); } }
    }
    c.restore();
  }
}

// boss ring volleys: every ring carries a walkable gap near the player, spaced so one dash charge can also clear each ring
function ringVolley(game, owner, n, firstDelay, spacing, speed, maxR, dmg, color) {
  const p = game.player; let gap = Math.atan2(p.y - owner.y, p.x - owner.x) + rand(-1.1, 1.1);
  for (let i = 0; i < n; i++) {
    const s = new Shockwave(owner.x, owner.y, firstDelay + i * spacing, speed, maxR, dmg, color); s.owner = owner; s.gapAng = gap; s.gapW = 0.95; game.hazards.push(s);
    gap += rand(0.5, 0.9) * (Math.random() < 0.5 ? -1 : 1);
  }
}

// telegraphed area strike: 'bite' (jaws close) or 'splash' (surfacing / slam)
class AreaStrike {
  constructor(target, delay, radius, dmg, style, owner, trackT) {
    this.target = target; this.x = target.x; this.y = target.y; this.delay = delay; this.radius = radius; this.dmg = dmg; this.style = style;
    this.owner = owner; this.trackT = trackT === undefined ? delay * 0.55 : trackT; this.t = 0; this.done = false; this.dead = false;
  }
  update(dt, game) {
    this.t += dt;
    if (this.t < this.trackT && this.target && !this.target.dead) { this.x = lerp(this.x, this.target.x, 1 - Math.exp(-dt * 10)); this.y = lerp(this.y, this.target.y, 1 - Math.exp(-dt * 10)); }
    if (!this.done && this.t >= this.delay) {
      this.done = true;
      const p = game.player; if (len(p.x - this.x, p.y - this.y) < this.radius + p.r * 0.5) p.hurt(this.dmg, this.x, this.y, game);
      Camera.addShake(0.35); FX.hitStop = Math.max(FX.hitStop, 0.04);
      if (this.style === 'bite') { Sfx.play('bite'); FX.burst(this.x, this.y, 26, '#ff4a5a', 260, 0.5, 4); }
      else { Sfx.play('splash'); FX.burst(this.x, this.y, 34, '#6fc8ff', 300, 0.6, 4); }
      if (this.owner && this.owner.onStrike) this.owner.onStrike(this, game);
    }
    if (this.t > this.delay + 0.25) this.dead = true;
  }
  draw(c) {}
  drawTelegraph(c) {
    if (this.done) return;
    const sx = Camera.sx(this.x), sy = Camera.sy(this.y), f = clamp(this.t / this.delay, 0, 1), R = this.radius;
    c.save();
    if (this.style === 'bite') {
      c.strokeStyle = `rgba(255,74,90,${0.5 + 0.5 * f})`; c.lineWidth = 2; c.setLineDash([5, 5]); c.beginPath(); c.arc(sx, sy, R, 0, TAU); c.stroke(); c.setLineDash([]);
      const gap = R * (1 - f) + 4;
      c.fillStyle = `rgba(255,74,90,${0.35 + 0.5 * f})`;
      for (const dir of [-1, 1]) {
        const jy = sy + dir * gap;
        c.beginPath(); c.moveTo(sx - R, jy); c.quadraticCurveTo(sx, jy + dir * R * 0.9, sx + R, jy); c.closePath(); c.fill();
        c.fillStyle = `rgba(255,240,230,${0.5 + 0.5 * f})`;
        for (let k = -3; k <= 3; k++) { const tx = sx + k * R * 0.26; c.beginPath(); c.moveTo(tx - 5, jy); c.lineTo(tx, jy - dir * 11); c.lineTo(tx + 5, jy); c.fill(); }
        c.fillStyle = `rgba(255,74,90,${0.35 + 0.5 * f})`;
      }
    } else {
      c.strokeStyle = `rgba(111,200,255,${0.5 + 0.5 * f})`; c.lineWidth = 2; c.beginPath(); c.arc(sx, sy, R, 0, TAU); c.stroke();
      c.fillStyle = `rgba(111,200,255,${0.1 + 0.3 * f})`; c.beginPath(); c.arc(sx, sy, R * f, 0, TAU); c.fill();
      for (let k = 0; k < 3; k++) { c.strokeStyle = `rgba(200,235,255,${0.4 * (1 - ((this.t * 2 + k / 3) % 1))})`; c.beginPath(); c.arc(sx, sy, R * ((this.t * 2 + k / 3) % 1), 0, TAU); c.stroke(); }
    }
    c.restore();
  }
}

// ---------------------------------------------------------------- BOSSES
class Boss extends Enemy {
  constructor(x, y, key, game) {
    super(x, y, key, game);
    const T = this.T; this.isBoss = true; this.hp = this.maxHp = Math.round(T.hp * diffK('hp')); this.hpTrail = this.hp; this.knockResist = 0.04;
    this.phase = 0; this.intro = 2.8; this.invulnT = 0; this.dying = 0; this.spawnT = 0; this.home = { x, y };
    this.cd = 1.6; this.setState('idle'); this.intangible = false; this.noclip = false; this.hidden = false; this.contact = T.damage; this.immuneMsg = 0; this.alpha = 0;
  }
  update(dt, game) {
    this.immuneMsg -= dt; this.invulnT -= dt; this.hpTrail = lerp(this.hpTrail, this.hp, 1 - Math.exp(-dt * 3));
    this.alpha = lerp(this.alpha, this.hidden ? 0 : 1, 1 - Math.exp(-dt * 8));
    if (this.dying > 0) {
      this.dying -= dt; this.flash = Settings.reduceFlash ? 0.35 : (Math.random() < 0.5 ? 1 : 0); /* reduced flashing: steady glow, no strobe */ this.vx *= 0.9; this.vy *= 0.9; this.hidden = false;
      if (Math.random() < 0.8) FX.burst(this.x + rand(-this.r, this.r), this.y + rand(-this.r, this.r), 3, this.T.color, 220, 0.6, 4);
      Camera.addShake(0.06); if (this.dying <= 0) this.finish(game); return;
    }
    if (this.intro > 0) { this.intro -= dt; this.wob += dt * 9; this.flash = Math.max(0, this.flash - dt * 7); const p = game.player; this.dx = p.x - this.x; this.dy = p.y - this.y; this.dist = len(this.dx, this.dy) || 1; this.nx = this.dx / this.dist; this.ny = this.dy / this.dist; return; }

    case 'prism': c.beginPath(); c.moveTo(0, -k); c.lineTo(k, k * 0.8); c.lineTo(-k, k * 0.8); c.closePath(); c.stroke(); c.beginPath(); c.moveTo(0, 0); c.lineTo(k * 1.2, -k * 0.4); c.moveTo(0, 0); c.lineTo(k * 1.2, k * 0.2); c.stroke(); break;
    case 'flame': c.beginPath(); c.moveTo(0, -k); c.quadraticCurveTo(k, 0, 0, k); c.quadraticCurveTo(-k, 0, 0, -k); c.fill(); break;
    case 'heart': c.beginPath(); c.moveTo(0, k); c.bezierCurveTo(-k * 1.4, -k * 0.2, -k * 0.5, -k * 1.2, 0, -k * 0.4); c.bezierCurveTo(k * 0.5, -k * 1.2, k * 1.4, -k * 0.2, 0, k); c.fill(); break;
    case 'ring': c.beginPath(); c.arc(0, 0, k, 0, TAU); c.stroke(); for (let i = 0; i < 6; i++) { const a = i * TAU / 6; c.beginPath(); c.moveTo(Math.cos(a) * k, Math.sin(a) * k); c.lineTo(Math.cos(a) * k * 1.4, Math.sin(a) * k * 1.4); c.stroke(); } break;
    case 'drop': c.beginPath(); c.moveTo(0, -k); c.quadraticCurveTo(k, k * 0.3, 0, k); c.quadraticCurveTo(-k, k * 0.3, 0, -k); c.fill(); break;
    case 'magnet': c.beginPath(); c.arc(0, 0, k * 0.8, Math.PI, 0); c.stroke(); c.fillRect(-k * 0.95, 0, k * 0.4, k * 0.6); c.fillRect(k * 0.55, 0, k * 0.4, k * 0.6); break;
    case 'blade': c.beginPath(); c.moveTo(0, -k * 1.1); c.lineTo(k * 0.3, k * 0.5); c.lineTo(-k * 0.3, k * 0.5); c.closePath(); c.fill(); c.fillRect(-k * 0.6, k * 0.5, k * 1.2, k * 0.2); break;
    case 'clock': c.beginPath(); c.arc(0, 0, k, 0, TAU); c.stroke(); c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -k * 0.7); c.moveTo(0, 0); c.lineTo(k * 0.5, 0); c.stroke(); break;
    case 'boot': c.fillRect(-k * 0.4, -k, k * 0.6, k * 1.4); c.fillRect(-k * 0.4, k * 0.2, k * 1.2, k * 0.5); break;
    case 'lantern': c.fillRect(-k * 0.15, -k * 1.1, k * 0.3, k * 0.3); c.beginPath(); c.arc(0, 0, k * 0.7, 0, TAU); c.fill(); break;

// floating relic you walk into
class RelicPickup extends Entity {
  constructor(x, y, id, priceless) { super(x, y, 14); this.id = id; this.R = RELIC_BY_ID[id]; this.t = 0; }
  update(dt, game) {
    this.t += dt; const p = game.player;
    if (this.t > 0.6 && game.state === 'play' && len(p.x - this.x, p.y - this.y) < p.r + this.r + 4) { this.dead = true; game.grantRelic(this.id, this.x, this.y); }
  }
  draw(c) { const sx = Camera.sx(this.x), sy = Camera.sy(this.y) + Math.sin(this.t * 3) * 3; c.fillStyle = 'rgba(0,0,0,0.35)'; c.beginPath(); c.ellipse(sx, Camera.sy(this.y) + 16, 12, 4, 0, 0, TAU); c.fill(); drawRelicIcon(c, sx, sy, 13, this.R); }
}

function relicPool(game, includeCursed) {
  const owned = new Set(game.relics.map(r => r.id)), onField = new Set(game.pickups.filter(k => k instanceof RelicPickup).map(k => k.id));
  return RELICS.filter(r => !owned.has(r.id) && !onField.has(r.id) && (!r.locked || Meta.data.unlocks.relicPack) && (includeCursed || !r.cursed));
}
function rollRelic(game) {
  const pool = relicPool(game, true); if (!pool.length) return null;
  const weights = pool.map(r => r.cursed ? 0.45 : 1), tot = weights.reduce((a, b) => a + b, 0);
  let x = Math.random() * tot; for (let i = 0; i < pool.length; i++) { x -= weights[i]; if (x <= 0) return pool[i].id; }
  return pool[0].id;
}

// burning trail from Cinder Step
class FireTrail {
  constructor(x, y) { this.x = x; this.y = y; this.t = 1.6; this.tick = 0; this.dead = false; }
  update(dt, game) {
    this.t -= dt; this.tick -= dt; if (this.t <= 0) { this.dead = true; return; }
    if (Math.random() < dt * 8) FX.burst(this.x, this.y, 1, '#ff8a3d', 40, 0.4, 3);
    if (this.tick <= 0) { this.tick = 0.3; for (const e of game.enemies) if (!e.dead && !e.intangible && len(e.x - this.x, e.y - this.y) < e.r + 16) e.takeHit(5, { vx: 0, vy: 0, quiet: true }, game); }
  }
  draw(c) { const sx = Camera.sx(this.x), sy = Camera.sy(this.y), a = clamp(this.t / 1.6, 0, 1); const g = c.createRadialGradient(sx, sy, 0, sx, sy, 16); g.addColorStop(0, `rgba(255,170,60,${0.8 * a})`); g.addColorStop(1, 'rgba(255,90,30,0)'); c.fillStyle = g; c.beginPath(); c.arc(sx, sy, 16, 0, TAU); c.fill(); }
}

const Game = {

  fightRoom: null, hazards: [], flares: [], boss: null, water: 0, stolenLantern: null, flashT: 0, bossCard: null, embers: 0, time: 0, best: 0, deathT: 0, transT: 0, exploreT: 0,

  newRun() {
    this.floor = 1; this.embers = 0; this.time = 0; this.player = new Player(0, 0); this.initRunExtras();
    this.state = 'transition'; this.transT = 0.6; this.transDone = true; Sfx.play('card'); // open on the floor card

    const s = Dungeon.startRoom, T = CONFIG.tile;
    const p = this.player; p.x = (s.ctx + 0.5) * T; p.y = (s.cty + 0.5) * T; p.vx = p.vy = 0; p.dashT = 0; p.trail = [];
    if (n > 1) p.gain(CONFIG.light.floorBonus);
    this.enemies = []; this.bolts = []; this.pickups = []; this.portals = []; this.globs = []; this.fightRoom = null;
    this.hazards = []; this.flares = []; this.boss = null; this.water = 0; this.stolenLantern = null; this.bossCard = null; p.lanternStolen = false; p.dimTarget = p.dimShow = 1; Music.stop();
    Camera.snap(p.x, p.y); Camera.trauma = 0;
    Dungeon.explore(p.x, p.y, p.radiusLight);
    if (this.state !== 'transition') FX.showBanner(floorText(n).toUpperCase().replace(/\/\d+$/, '') + ' — ' + Dungeon.biome.name.toUpperCase(), Dungeon.biome.sub, 3.6, Dungeon.biome.accent, true); // transitions show the full floor card instead
    Sfx.play('floor'); Sfx.setBiome(bioIdx(n)); Ambient.forFloor(n);

  onPlayerDash(dir) {
    const p = this.player, d = CONFIG.player.dashDist;
    let tx = p.x + dir.x * d, ty = p.y + dir.y * d; if (Dungeon.pointSolid(tx, ty)) { tx = p.x; ty = p.y; }
    for (const e of this.enemies) if (e.type === 'mirror' && len(e.x - p.x, e.y - p.y) < 650) e.queueCopy(tx, ty);
  },
  spawnEnemyNear(type, x, y) {
    const T = ENEMY_TYPES[type], n = T.group || 1, out = [];
    for (let i = 0; i < n; i++) { const e = new T.cls(x + rand(-10, 10), y + rand(-10, 10), this); e.room = this.fightRoom; this.enemies.push(e); out.push(e); }
    return out;
  },
  flash(a) { this.flashT = Math.max(this.flashT, a * (Settings.reduceFlash ? 0.25 : 1)); },
  waterInfo() {
    if (!this.boss || this.water <= 0) return null;
    const r = this.fightRoom, T = CONFIG.tile, base = r ? Math.min(r.w, r.h) * T * 0.55 : 420;
    return { x: this.boss.home.x, y: this.boss.home.y, r: lerp(base, base * 0.6, this.water), base };
  },
  spawnBoss(key, room) {
    const T = CONFIG.tile, p = this.player;
    let x, y;
    if (room) { x = (room.ctx + 0.5) * T; y = (room.cty + 0.5) * T; if (len(x - p.x, y - p.y) < 160) { y += p.y > y ? -170 : 170; if (Dungeon.pointSolid(x, y)) y = (room.cty + 0.5) * T; } }
    else { const a = p.aim; x = p.x + Math.cos(a) * 220; y = p.y + Math.sin(a) * 220; if (Dungeon.pointSolid(x, y)) { x = p.x; y = p.y - 200; if (Dungeon.pointSolid(x, y)) { x = p.x + 120; y = p.y; } } }
    const b = new ENEMY_TYPES[key].cls(x, y, this); b.room = room; if (room) b.home = { x: (room.ctx + 0.5) * T, y: (room.cty + 0.5) * T };

    const D = ENEMY_TYPES[key];

  },

function drawWorld(c) {

    for (const i of r.doors) {
      if (!Dungeon.sealed[i]) continue;
      const x = (i % Dungeon.W) * T, y = ((i / Dungeon.W) | 0) * T;
      if (!Camera.onScreen(x, y, 40)) continue;
      const sx = Camera.sx(x), sy = Camera.sy(y);
      c.fillStyle = b.wall; c.fillRect(sx, sy, T, T);
      c.strokeStyle = b.accent; c.globalAlpha = 0.55 + 0.3 * Math.sin(t * 5 + i); c.lineWidth = 2;
      c.beginPath(); c.moveTo(sx + 4, sy + 4); c.lineTo(sx + T - 4, sy + T - 4); c.moveTo(sx + T - 4, sy + 4); c.lineTo(sx + 4, sy + T - 4); c.stroke();
      c.globalAlpha = 1; c.strokeStyle = 'rgba(0,0,0,0.6)'; c.strokeRect(sx + 1, sy + 1, T - 2, T - 2);

    if (!Camera.onScreen(p.x, p.y, 80)) continue;
    const sx = Camera.sx(p.x), sy = Camera.sy(p.y), pulse = 0.5 + 0.5 * Math.sin(t * 2 + p.ph);
    const g = c.createRadialGradient(sx, sy, 0, sx, sy, p.r);
    g.addColorStop(0, `rgba(${b.pool},0.55)`); g.addColorStop(0.7, `rgba(${b.pool},0.25)`); g.addColorStop(1, `rgba(${b.pool},0)`);
    c.fillStyle = g; c.beginPath(); c.arc(sx, sy, p.r, 0, TAU); c.fill();
    c.strokeStyle = `rgba(${b.pool},${0.4 + 0.4 * pulse})`; c.lineWidth = 1.5; c.beginPath(); c.arc(sx, sy, p.r * (0.6 + 0.3 * ((t * 0.5 + p.ph) % 1)), 0, TAU); c.stroke();

    const sx = Camera.sx(s.x), sy = Camera.sy(s.y);
    for (let k = 4; k >= 0; k--) { c.fillStyle = Dungeon.stairsOpen ? `rgba(${b.pool},${0.15 + k * 0.05})` : `rgba(0,0,0,${0.3 + k * 0.1})`; c.fillRect(sx - 20 + k * 2, sy - 20 + k * 4, 40 - k * 4, 40 - k * 4); }

  }
}

// ---------------------------------------------------------------- WATCHDOG: NaN positions, boss outside its arena, sealed rooms with nobody left, stuck in walls
const Watchdog = {
  t: 0, emptyT: 0, outT: 0, stuckT: 0, fixes: { nanPlayer: 0, nanEnemy: 0, bossHome: 0, emptyRoom: 0, unstuck: 0, stateFix: 0 },
  freeNear(x, y) { const T = CONFIG.tile; for (let r = 0; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; const px = (Math.floor(x / T) + dx + 0.5) * T, py = (Math.floor(y / T) + dy + 0.5) * T; if (!Dungeon.pointSolid(px, py)) return { x: px, y: py }; } return null; },
  roomCentre(r) { const T = CONFIG.tile; return { x: (r.ctx + 0.5) * T, y: (r.cty + 0.5) * T }; },
  update(dt) {
    const G = Game, p = G.player; if (G.state !== 'play' || !p) { this.emptyT = this.outT = 0; return; }
    // every frame: NaN guards are cheap and must catch the problem before it spreads
    if (!isFinite(p.x) || !isFinite(p.y)) { const r = G.fightRoom || Dungeon.startRoom || Dungeon.rooms[0]; const c = this.roomCentre(r); p.x = c.x; p.y = c.y; p.vx = p.vy = 0; this.fixes.nanPlayer++; }
    if (!isFinite(p.vx) || !isFinite(p.vy)) { p.vx = p.vy = 0; this.fixes.nanPlayer++; }
    if (!isFinite(p.light)) { p.light = p.maxLight * 0.5; this.fixes.nanPlayer++; }
    for (const e of G.enemies) if (!e.dead && (!isFinite(e.x) || !isFinite(e.y) || !isFinite(e.hp))) {
      this.fixes.nanEnemy++; if (e.isBoss && e.home) { e.x = e.home.x; e.y = e.home.y; e.vx = e.vy = 0; if (!isFinite(e.hp)) e.hp = e.maxHp * 0.5; } else e.dead = true;
    }
    this.t += dt; if (this.t < 0.5) return; const step = this.t; this.t = 0;
    // boss outside its arena (not while blinking / hidden / composite)
    const b = G.boss;
    if (b && b.room && b.home && !b.hidden && !b.composite && b.dying <= 0 && Dungeon.roomAt(b.x, b.y, 0) !== b.room) { this.outT += step; if (this.outT >= 1.5) { const f = Dungeon.pointSolid(b.home.x, b.home.y) ? this.freeNear(b.home.x, b.home.y) : b.home; if (f) { b.x = f.x; b.y = f.y; b.vx = b.vy = 0; this.fixes.bossHome++; } this.outT = 0; } } else this.outT = 0;
    // sealed fight room with nobody left and nothing coming
    const r = G.fightRoom;
    if (r && r.state === 'fight') {
      const alive = G.enemies.some(e => !e.dead), pend = (G.portals || []).length > 0, moreWaves = !!(r.waves && r.waves.length), bossUp = G.boss && !G.boss.dead;
      for (const e of G.enemies) { if (e.dead || e.isBoss || e.composite || e.hidden || e.type === 'choirhead') continue; // an add stranded outside the sealed room would block the doors forever
        if (Dungeon.roomAt(e.x, e.y, 0) !== r) { e._outT = (e._outT || 0) + step; if (e._outT >= 4) { const f = Dungeon.randomFloorIn(r, p.x, p.y, 150); if (f) { e.x = f.x; e.y = f.y; e.vx = e.vy = 0; this.fixes.strandedAdd = (this.fixes.strandedAdd || 0) + 1; } e._outT = 0; } } else e._outT = 0; }
      if (!alive && !pend && !moreWaves && !bossUp) { this.emptyT += step; if (this.emptyT >= 3) { this.emptyT = 0; this.fixes.emptyRoom++; G.clearRoom(r); } } else this.emptyT = 0;
    } else this.emptyT = 0;
    // hero wedged inside a wall
    if (Dungeon.pointSolid(p.x, p.y)) { this.stuckT += step; if (this.stuckT >= 1) { const f = this.freeNear(p.x, p.y); if (f) { p.x = f.x; p.y = f.y; p.vx = p.vy = 0; this.fixes.unstuck++; } this.stuckT = 0; } } else this.stuckT = 0;
  },
};
{
  const gu = Game.update; Game.update = function (dt) { const r = gu.call(this, dt); Watchdog.update(dt); return r; };
}

// ---------------------------------------------------------------- SAVE VALIDATION: a damaged or old run save is dropped, never crashes Continue
RunSave.valid = function (d) {
  if (!d || typeof d !== 'object' || d.v !== 1) return false;
  if (!Number.isInteger(d.floor) || d.floor < 1 || d.floor > 400) return false;
  if (!d.p || typeof d.p !== 'object' || !isFinite(d.p.light) || !isFinite(d.p.baseMax || 100)) return false;
  if (!Array.isArray(d.relics) || d.relics.some(id => typeof id !== 'string')) return false;
  for (const k of ['embers', 'time']) if (d[k] !== undefined && !isFinite(d[k])) return false;
  return true;
};
{
  const rd = RunSave.read.bind(RunSave);
  RunSave.read = function () { const d = rd(); if (d && !this.valid(d)) { this.clear(); return null; } if (!d) { try { if (localStorage.getItem(RUN_KEY) !== null) this.clear(); } catch (e) { /* blocked */ } } return d; };
  RunSave.has = function () { return !!this.read(); };
  const cr = Game.continueRun;
  Game.continueRun = function () {
    try { const ok = cr.call(this); if (!ok) { RunSave.clear(); syncTitleItems(); this.state = 'title'; } return ok; }
    catch (e) { Crash.note(e, 'continue'); Crash.err = null; RunSave.clear(); syncTitleItems(); this.state = 'title'; this.menuIdx = 0; Toast.push('That saved run could not be loaded', 'It has been cleared - start a new run', '#ff9a7a', 'codex'); return false; }
  };
}
Object.assign(window.__LF, { Crash, Watchdog, RunSave });

// ---------------------------------------------------------------- BALANCE (Polish 4): Hollow King phase II on Lantern
// Bot losses clustered in phase II and came from an empty lantern, not big hits: phase-I mothlings kept chewing light while the Bell
// echo began. On Lantern only, entering phase II now dissolves the King's mothlings into light shards (max 4); the Bell echo itself also
// hits 20% softer and attacks a little slower (see HollowKing.think). Ember and Ashen are unchanged.
{
  const op = HollowKing.prototype.onPhase;
  HollowKing.prototype.onPhase = function (game, ph) {
    if (op) op.call(this, game, ph);
    if (ph === 1 && Game.diff === 'lantern') { let n = 0; for (const e of game.enemies) if (e.type === 'mothling' && !e.dead) { e.dead = true; FX.burst(e.x, e.y, 10, '#ffe08a', 160, 0.4, 2); if (n++ < 4) game.pickups.push(new Pickup(e.x, e.y, 'shard')); } }
  };
}
