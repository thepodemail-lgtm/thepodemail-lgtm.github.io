<script>
'use strict';
(function(){
// =============================================================================
// CREDITS (shown in-game; mirrors the comment block in <head>)
// =============================================================================
const CREDITS = `PORTALFELL - one-room portal shooter
Built by Claude (Anthropic, Opus 5.5) for Daniel's PORTALFELL bench, Nov 20 2026.

Every asset is ORIGINAL and generated by code inside this single HTML file
at load time. Nothing is downloaded: no image, audio, font or library files.

TEXTURES  walls, floor, ceiling, pillars, bronze column, portal frames
          source: procedural generators in this file   license: CC0 1.0
SPRITES   Husk, Gazer, Bulwark (+ death frames), barrel, medkit, shell box,
          fireballs, Scatter Cannon view model
          source: Canvas2D drawing code in this file    license: CC0 1.0
MUSIC     "Fellstep" - looping chiptune, E minor, 138 BPM, 32 bars
          source: original note data + Web Audio synth  license: CC0 1.0
SFX       shots, force push, slams, portal, explosions, pickups
          source: Web Audio synthesis in this file      license: CC0 1.0
FONTS     device system fonts (not embedded)

PHYSICS   bodies keep momentum through portals; knockback; wall/pillar slam
          damage; bowling collisions; barrels and fireballs pass through
          portals; Force Push reflects fireballs; hitscan passes portals.`;

// =============================================================================
// UTIL
// =============================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp8 = v => v < 0 ? 0 : v > 255 ? 255 : v | 0;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry32(12345);
const rand = () => rng();
const vrand = Math.random; // visual-only randomness (does not affect sim determinism)
function angDiff(a, b){ let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function hash(x, y, s){ let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263) ^ Math.imul(s | 0, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, p, s){
  const x0 = Math.floor(x), y0 = Math.floor(y), fx = x - x0, fy = y - y0;
  const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const xa = ((x0 % p) + p) % p, xb = ((x0 + 1) % p + p) % p, ya = ((y0 % p) + p) % p, yb = ((y0 + 1) % p + p) % p;
  return lerp(lerp(hash(xa, ya, s), hash(xb, ya, s), sx), lerp(hash(xa, yb, s), hash(xb, yb, s), sx), sy);
}
function fbm(x, y, s){ let v = 0, a = 0.5, f = 4; for (let o = 0; o < 4; o++){ v += a * vnoise(x / 64 * f, y / 64 * f, f, s + o * 17); a *= 0.5; f *= 2; } return v / 0.9375; }
function mk(w, h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function ell(g, x, y, rx, ry, rot, fill){ g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); if (fill) g.fillStyle = fill; g.fill(); }

// =============================================================================
// MAP
// =============================================================================
const MW = 16, MH = 16;
const MAP_SRC = [
  "################",
  "#..............#",
  "#..............#",
  "#..............#",
  "A........P.....#",
  "#..............#",
  "#...P..........#",
  "#......CC......#",
  "#......CC......#",
  "#..........P...#",
  "#..............#",
  "#.....P........B",
  "#..............#",
  "#..............#",
  "#..............#",
  "################"];
const map = new Uint8Array(MW * MH);
for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++){
  const ch = MAP_SRC[y][x];
  map[y * MW + x] = ch === '#' ? 1 : ch === 'P' ? 2 : ch === 'C' ? 3 : ch === 'A' ? 10 : ch === 'B' ? 11 : 0;
}
const wallVar = new Uint8Array(MW * MH);
for (let i = 0; i < MW * MH; i++){ const h = hash(i % MW, (i / MW) | 0, 99); wallVar[i] = h < 0.55 ? 0 : h < 0.8 ? 1 : 2; }
function solidAt(x, y){ if (x < 0 || y < 0 || x >= MW || y >= MH) return true; const c = map[y * MW + x]; return c === 1 || c === 2 || c === 3; }

// ---------------- PORTALS ----------------
function makePortal(id, cx, cy, nx, ny, color, name){
  return { id, cx, cy, nx, ny, tx: -ny, ty: nx, px: cx + 0.5 + nx * 0.5, py: cy + 0.5 + ny * 0.5, color, name, M: null, dAng: 0, link: null, cell: cy * MW + cx, front: (cy + ny) * MW + (cx + nx) };
}
const portals = [ makePortal(0, 0, 4, 1, 0, [70, 170, 255], 'BLUE'), makePortal(1, 15, 11, -1, 0, [255, 140, 40], 'ORANGE') ];
// Transform for a body that ENTERS P and EXITS Q (rigid, orientation-preserving):
// local (a along tangent, b along normal) at P  ->  (-a, -b) at Q.
function portalMatrix(P, Q){
  const a = -(Q.tx * P.tx + Q.nx * P.nx), b = -(Q.tx * P.ty + Q.nx * P.ny);
  const c = -(Q.ty * P.tx + Q.ny * P.nx), d = -(Q.ty * P.ty + Q.ny * P.ny);
  return { a, b, c, d, tx: Q.px - (a * P.px + b * P.py), ty: Q.py - (c * P.px + d * P.py) };
}
function linkPortals(){
  portals[0].link = portals[1]; portals[1].link = portals[0];
  for (const P of portals){ P.M = portalMatrix(P, P.link); P.dAng = Math.atan2(P.M.c, P.M.a); }
}
linkPortals();
const portalByCell = {};
for (const P of portals) portalByCell[P.cell] = P;
const IDENT = { a: 1, b: 0, c: 0, d: 1, tx: 0, ty: 0 };
function compose(A, B){ return { a: A.a * B.a + A.b * B.c, b: A.a * B.b + A.b * B.d, c: A.c * B.a + A.d * B.c, d: A.c * B.b + A.d * B.d, tx: A.a * B.tx + A.b * B.ty + A.tx, ty: A.c * B.tx + A.d * B.ty + A.ty }; }
const MAXSEG = 6;
const FWD = new Array(1 << MAXSEG), INV = new Array(1 << MAXSEG), CODEDEPTH = new Int8Array(1 << MAXSEG);
function buildCodeTables(){
  FWD[1] = IDENT; INV[1] = IDENT; CODEDEPTH[1] = 0;
  for (let code = 2; code < (1 << MAXSEG); code++){
    const parent = code >> 1, P = portals[code & 1];
    FWD[code] = compose(P.M, FWD[parent]);
    INV[code] = compose(INV[parent], P.link.M);
    CODEDEPTH[code] = CODEDEPTH[parent] + 1;
  }
}
buildCodeTables();

// ---------------- DDA ----------------
let HIT_DIST = 0, HIT_MX = 0, HIT_MY = 0, HIT_SIDE = 0, HIT_CELL = 0;
function dda(ox, oy, dx, dy){
  if (dx === 0) dx = 1e-9; if (dy === 0) dy = 1e-9;
  let mx = Math.floor(ox), my = Math.floor(oy);
  const ddx = Math.abs(1 / dx), ddy = Math.abs(1 / dy);
  let stepX, stepY, sideX, sideY;
  if (dx < 0){ stepX = -1; sideX = (ox - mx) * ddx; } else { stepX = 1; sideX = (mx + 1 - ox) * ddx; }
  if (dy < 0){ stepY = -1; sideY = (oy - my) * ddy; } else { stepY = 1; sideY = (my + 1 - oy) * ddy; }
  for (let i = 0; i < 64; i++){
    let side;
    if (sideX < sideY){ sideX += ddx; mx += stepX; side = 0; } else { sideY += ddy; my += stepY; side = 1; }
    let cell;
    if (mx < 0 || my < 0 || mx >= MW || my >= MH) cell = 1; else cell = map[my * MW + mx];
    if (cell !== 0){
      HIT_DIST = side === 0 ? sideX - ddx : sideY - ddy; HIT_MX = mx; HIT_MY = my; HIT_SIDE = side; HIT_CELL = cell;
      return;
    }
  }
  HIT_DIST = 64; HIT_MX = mx; HIT_MY = my; HIT_SIDE = 0; HIT_CELL = 1;
}
// is the current hit the open face of a portal?
function hitPortal(dx, dy){
  if (HIT_CELL !== 10 && HIT_CELL !== 11) return null;
  const P = portalByCell[HIT_MY * MW + HIT_MX]; if (!P) return null;
  if (P.nx !== 0){ if (HIT_SIDE !== 0 || Math.sign(dx) !== -P.nx) return null; }
  else { if (HIT_SIDE !== 1 || Math.sign(dy) !== -P.ny) return null; }
  return P;
}

// LOS (direct, no portals)
function hasLOS(x0, y0, x1, y1){
  const dx = x1 - x0, dy = y1 - y0, d = Math.hypot(dx, dy); if (d < 1e-6) return true;
  const n = Math.ceil(d / 0.12);
  for (let i = 1; i < n; i++){ const t = i / n; if (solidAt(Math.floor(x0 + dx * t), Math.floor(y0 + dy * t))) return false; }
  return true;
}
function clearance(x, y){
  let best = 9; const cx = Math.floor(x), cy = Math.floor(y);
  for (let j = cy - 2; j <= cy + 2; j++) for (let i = cx - 2; i <= cx + 2; i++){
    if (!solidAt(i, j)) continue;
    const qx = clamp(x, i, i + 1), qy = clamp(y, j, j + 1); const d = Math.hypot(x - qx, y - qy); if (d < best) best = d;
  }
  return best;
}

// ---------------- FLOW FIELDS (portal-aware BFS) ----------------
const NCELL = MW * MH;
const NEI = [];
(function buildGraph(){
  for (let i = 0; i < NCELL; i++){
    const x = i % MW, y = (i / MW) | 0, list = [];
    if (solidAt(x, y)){ NEI.push(list); continue; }
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++){
      if (!dx && !dy) continue;
      const nx = x + dx, ny = y + dy; if (solidAt(nx, ny)) continue;
      if (dx && dy && (solidAt(x + dx, y) || solidAt(x, y + dy))) continue;
      const ni = ny * MW + nx;
      if ((map[ni] >= 10 || map[i] >= 10) && dx && dy) continue; // enter portals head-on only
      list.push(ni);
    }
    const P = portalByCell[i]; if (P) list.push(P.link.front);
    NEI.push(list);
  }
  for (const P of portals) NEI[P.link.front].push(P.cell);
})();
function bfs(start, out){
  out.fill(-1); if (start < 0 || start >= NCELL || solidAt(start % MW, (start / MW) | 0)) return out;
  const q = new Int16Array(NCELL); let h = 0, t = 0; q[t++] = start; out[start] = 0;
  while (h < t){ const c = q[h++]; const nl = NEI[c]; for (let k = 0; k < nl.length; k++){ const n = nl[k]; if (out[n] < 0){ out[n] = out[c] + 1; q[t++] = n; } } }
  return out;
}
const cellOf = (x, y) => clamp(Math.floor(y), 0, MH - 1) * MW + clamp(Math.floor(x), 0, MW - 1);

// =============================================================================
// TEXTURES (procedural)
// =============================================================================
const TS = 64;
function texFrom(fn){
  const t = new Uint32Array(TS * TS);
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++){
    const c = fn(x, y); const a = c.length > 3 ? c[3] : 255;
    t[y * TS + x] = ((a << 24) | (clamp8(c[2]) << 16) | (clamp8(c[1]) << 8) | clamp8(c[0])) >>> 0;
  }
  return t;
}
function genWall(variant){
  return texFrom((x, y) => {
    const n = fbm(x, y, 11 + variant), n2 = fbm(x, y, 23);
    const py = y % 32;
    let k = 0.6 + 0.55 * n;
    if (py < 2) k += 0.32; else if (py > 29) k -= 0.34;
    if (x < 2) k += 0.22; else if (x > 61) k -= 0.3;
    if ((py === 5 || py === 26) && x > 5 && x < 58) k -= 0.2;
    if ((py === 6 || py === 27) && x > 5 && x < 58) k += 0.1;
    const rv = [[6, 9], [57, 9], [6, 22], [57, 22]];
    for (let i = 0; i < 4; i++){ const d = Math.hypot(x - rv[i][0], py - rv[i][1]); if (d < 2.3){ k += 0.55 - d * 0.22; if (d > 1.5) k -= 0.4; } }
    let r = 60 * k, g = 64 * k, b = 76 * k;
    const rs = vnoise(x / 64 * 16, y / 64 * 3, 16, 7 + variant);
    if (rs > 0.66){ const a = Math.min(1, (rs - 0.66) * 4) * 0.6; r = lerp(r, 120 * k + 18, a); g = lerp(g, 60 * k, a); b = lerp(b, 32 * k, a); }
    if (variant === 1 && y >= 43 && y <= 47){
      if (y === 43 || y === 47) return [22, 26, 32];
      if ((x % 16) < 13){ const gl = 0.85 + 0.15 * n2; return [70 * gl, 215 * gl, 255 * gl, 254]; }
      return [18, 22, 28];
    }
    if (variant === 2 && y >= 37 && y <= 59 && x >= 13 && x <= 50){
      if (x === 13 || x === 50 || y === 37 || y === 59) return [24, 26, 32];
      if ((y - 37) % 5 < 2) return [r * 0.75 + 12, g * 0.75 + 10, b * 0.75 + 10];
      const gl = 0.7 + 0.3 * Math.sin(x * 0.35); return [255 * gl, 96 * gl, 34 * gl, 254];
    }
    return [r, g, b];
  });
}

function genTextures(){
